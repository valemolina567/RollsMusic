{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Álbum - RollsMusic</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        :root{
            --rm-bg:#111111;
            --rm-surface:#1E1E1E;
            --rm-accent:#00AEEF;
            --rm-text-primary:#FFFFFF;
            --rm-text-secondary:#CCCCCC;
        }

        body{
            background:var(--rm-bg);
            color:var(--rm-text-primary);
            font-family:'Segoe UI',sans-serif;
        }

        .navbar-rm{
            background:var(--rm-surface);
            padding:15px 30px;
            border-bottom:1px solid #333;
        }

        .admin-card{
            background:var(--rm-surface);
            border:1px solid #333;
            border-radius:8px;
            padding:30px;
            margin-top:20px;
        }

        .form-control,
        .form-select{
            background:#252525;
            color:#fff;
            border:1px solid #444;
        }

        .form-control:focus,
        .form-select:focus{
            background:#2a2a2a;
            color:#fff;
            border-color:var(--rm-accent);
            box-shadow:0 0 0 .25rem rgba(0,174,239,.25);
        }

        .form-label{
            color:var(--rm-text-secondary);
            font-weight:600;
            font-size:.9rem;
        }

        input[type="date"]::-webkit-calendar-picker-indicator{
            filter:invert(1);
            cursor:pointer;
        }

        .btn-volver{
            color:#E0E0E0;
            font-weight:600;
            text-decoration:none;
        }

        .btn-volver:hover{
            color:var(--rm-accent);
        }

        .btn-rm-accent{
            background:var(--rm-accent);
            color:#000;
            font-weight:700;
            border:none;
        }

        .btn-rm-accent:hover{
            background:#009cd4;
            color:#000;
        }

        .preview{
            width:220px;
            height:220px;
            object-fit:cover;
            border-radius:10px;
            border:2px solid #444;
            background:#252525;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-rm d-flex justify-content-between align-items-center">
    <a href="{% url 'index' %}" class="text-decoration-none d-flex align-items-center gap-2">
        <img src="{% static 'images/Logo.png' %}" style="max-height:45px;">
        <span class="fs-4 fw-bold text-white">RollsMusic</span>
    </a>
</nav>

<div class="container mt-5" style="max-width:700px;">

    <a href="{% url 'listar_albumes' %}" class="btn-volver d-inline-flex align-items-center mb-3">
        <i class="bi bi-arrow-left-short fs-4 text-info"></i>
        Cancelar y volver
    </a>

    <div class="admin-card">

        <div class="d-flex align-items-center mb-4">
            <i class="bi bi-pencil-square fs-2 me-3 text-info"></i>

            <div>
                <h3 class="fw-bold mb-0">
                    Editar Álbum
                </h3>

                <p class="mb-0" style="color:var(--rm-text-secondary)">
                    Modifica la información del álbum.
                </p>
            </div>
        </div>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    Título del Álbum
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="titulo"
                    value="{{ item.titulo }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Fecha de Lanzamiento
                </label>

                <input
                    type="date"
                    class="form-control"
                    name="fechaLanzamiento"
                    value="{{ item.fechaLanzamiento|date:'Y-m-d' }}"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Artista / Banda
                </label>

                <select
                    name="artista"
                    class="form-select"
                    required>

                    {% for a in artistas %}
                        <option
                            value="{{ a.idArtista }}"
                            {% if a.idArtista == item.Artista_idArtista.idArtista %}selected{% endif %}>

                            {{ a.nombreArtistico }}

                        </option>
                    {% endfor %}

                </select>
            </div>

            <div class="mb-3">

                <label class="form-label">
                    Portada actual
                </label>

                <div class="text-center mb-3">

                    {% if item.imagen %}
                        <img
                            src="{{ item.imagen.url }}"
                            class="preview"
                            id="preview">
                    {% else %}
                        <img
                            src="{% static 'images/default_album.png' %}"
                            class="preview"
                            id="preview">
                    {% endif %}

                </div>

                <label class="form-label">
                    Cambiar portada
                </label>

                <input
                    type="file"
                    class="form-control"
                    name="imagen"
                    accept="image/*"
                    onchange="previewImage(event)">

            </div>

            <button class="btn btn-rm-accent w-100">
                <i class="bi bi-arrow-clockwise me-2"></i>
                Actualizar Álbum
            </button>

        </form>

    </div>

</div>

<script>
function previewImage(event){

    const reader=new FileReader();

    reader.onload=function(){

        document.getElementById("preview").src=reader.result;

    }

    if(event.target.files.length>0){

        reader.readAsDataURL(event.target.files[0]);

    }

}
</script>

</body>
</html>
